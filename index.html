<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070c">

  <title>Relaxify — Indian Music</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <script src="https://sdk.scdn.co/spotify-player.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Inter, sans-serif;
      color: white;
      background: #05070c;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -2;

      background:
        linear-gradient(
          rgba(0,0,0,.25),
          rgba(0,0,0,.78)
        ),
        url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1920&q=85");

      background-size: cover;
      background-position: center;
    }

    .app {
      width: 100%;
      height: 100dvh;
      padding: 20px;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    .topbar {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand {
      color: white;
      text-decoration: none;

      font-family: "Playfair Display", serif;

      font-size: clamp(45px, 12vw, 75px);
      font-weight: 800;

      letter-spacing: -3px;

      text-shadow: 0 5px 30px rgba(0,0,0,.7);
    }

    .top-actions {
      position: absolute;
      right: 0;
      top: 50%;

      transform: translateY(-50%);

      display: flex;
      gap: 7px;
    }

    .icon-button {
      width: 40px;
      height: 40px;

      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;

      background: rgba(20,20,25,.5);

      color: white;
      font-size: 18px;

      cursor: pointer;

      backdrop-filter: blur(15px);
    }

    #spotifyButton.connected {
      background: rgba(30,215,96,.25);
      border-color: rgba(30,215,96,.6);
    }

    .search-panel {
      position: absolute;

      top: 72px;
      right: 20px;

      width: min(350px, calc(100% - 40px));

      padding: 10px;

      display: none;
      gap: 7px;

      z-index: 20;

      border: 1px solid rgba(255,255,255,.16);
      border-radius: 15px;

      background: rgba(15,16,22,.86);

      backdrop-filter: blur(25px);

      box-shadow: 0 15px 50px rgba(0,0,0,.5);
    }

    .search-panel.open {
      display: flex;
    }

    .search-panel input {
      flex: 1;
      min-width: 0;

      height: 38px;

      padding: 0 12px;

      border: 0;
      outline: 0;

      border-radius: 10px;

      color: white;

      background: rgba(255,255,255,.09);
    }

    .search-panel input::placeholder {
      color: rgba(255,255,255,.5);
    }

    .search-panel button {
      height: 38px;

      padding: 0 13px;

      border: 0;
      border-radius: 10px;

      background: white;
      color: #111;

      font-weight: 600;

      cursor: pointer;
    }

    .player-section {
      flex: 1;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: flex-end;

      flex-direction: column;

      padding-bottom: 18px;
    }

    .glass-player {
      width: min(560px, 100%);

      padding: 13px 15px;

      border-radius: 22px;

      background: rgba(18,19,25,.58);

      border: 1px solid rgba(255,255,255,.17);

      backdrop-filter: blur(25px);

      box-shadow: 0 20px 60px rgba(0,0,0,.55);
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .cover {
      width: 56px;
      height: 56px;

      flex-shrink: 0;

      border-radius: 13px;

      background: rgba(255,255,255,.08);

      background-size: cover;
      background-position: center;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .cover-note {
      font-size: 22px;
      opacity: .7;
    }

    .song-info {
      min-width: 0;
      flex: 1;
    }

    .song-info h1 {
      font-size: 14px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-info p {
      margin-top: 4px;

      font-size: 10px;

      color: rgba(255,255,255,.58);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .controls button {
      width: 34px;
      height: 34px;

      border: 0;
      background: transparent;

      color: white;

      font-size: 18px;

      cursor: pointer;
    }

    .controls .main-play {
      width: 43px;
      height: 43px;

      border-radius: 50%;

      background: white;
      color: #111;

      font-size: 15px;
    }

    .progress-area {
      display: grid;

      grid-template-columns: 30px 1fr 30px;

      align-items: center;

      gap: 7px;

      margin-top: 8px;
    }

    .progress-area span {
      font-size: 9px;
      color: rgba(255,255,255,.55);
    }

    #duration {
      text-align: right;
    }

    #progress {
      width: 100%;
      height: 4px;

      accent-color: white;

      cursor: pointer;
    }

    .status {
      text-align: center;

      margin-top: 8px;

      font-size: 9px;

      color: rgba(255,255,255,.55);
    }

    #youtubePlayer {
      display: none;
    }

    #spotifyPlayer {
      position: fixed;

      width: 1px;
      height: 1px;

      left: -10000px;
      top: -10000px;
    }

    footer {
      flex-shrink: 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 9px;

      color: rgba(255,255,255,.55);
    }

    footer strong {
      color: white;
    }

    footer a {
      color: white;
      text-decoration: none;
    }

    @media (max-height: 650px) {

      .app {
        padding-top: 10px;
      }

      .brand {
        font-size: 43px;
      }

      .player-section {
        padding-bottom: 10px;
      }

      footer {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <main class="app">

    <header class="topbar">

      <a href="#" class="brand">
        Relaxify
      </a>

      <div class="top-actions">

        <button
          id="spotifyButton"
          class="icon-button"
          type="button"
          title="Connect Spotify"
        >
          ♪
        </button>

        <button
          id="searchButton"
          class="icon-button"
          type="button"
          title="Search"
        >
          ⌕
        </button>

      </div>

    </header>


    <form
      id="searchPanel"
      class="search-panel"
    >

      <input
        id="searchInput"
        type="search"
        placeholder="Search Hindi song..."
        autocomplete="off"
      >

      <button type="submit">
        Search
      </button>

    </form>


    <section class="player-section">

      <div class="glass-player">

        <div class="player-top">

          <div
            class="cover"
            id="cover"
          >
            <div class="cover-note">
              ♪
            </div>
          </div>


          <div class="song-info">

            <h1 id="songTitle">
              Connect Spotify
            </h1>

            <p id="artistName">
              Search and play Indian music
            </p>

          </div>


          <div class="controls">

            <button
              id="previousButton"
              type="button"
            >
              ⏮
            </button>

            <button
              id="playButton"
              class="main-play"
              type="button"
            >
              ▶
            </button>

            <button
              id="nextButton"
              type="button"
            >
              ⏭
            </button>

          </div>

        </div>


        <div class="progress-area">

          <span id="currentTime">
            0:00
          </span>

          <input
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
          >

          <span id="duration">
            0:00
          </span>

        </div>


        <div
          id="status"
          class="status"
        >
          Connect Spotify to start
        </div>

      </div>

    </section>


    <div id="spotifyPlayer"></div>


    <footer>

      <span>
        <strong>Relaxify</strong>
        • Made for quieter moments
      </span>

      <a
        href="https://instagram.com/sakil_miah_"
        target="_blank"
        rel="noopener noreferrer"
      >
        @sakil_miah_
      </a>

    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
