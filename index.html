<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070c"
  >

  <title>Relaxify — Indian Music</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #05070c;
      color: #fff;
    }

    /* BACKGROUND */

    .background {
      position: fixed;
      inset: 0;
      z-index: -2;

      background-image:
        linear-gradient(
          rgba(0,0,0,.38),
          rgba(0,0,0,.72)
        ),
        url("https://unsplash.com/photos/photography-of-lightning-storm-in9-n0JwgZ0/download?force=true&w=1920");

      background-size: cover;
      background-position: center;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255,255,255,.08),
          transparent 42%
        ),
        linear-gradient(
          to bottom,
          transparent,
          rgba(0,0,0,.55)
        );
    }


    /* APP */

    .app {
      width: 100%;
      height: 100dvh;

      padding: 24px 18px 18px;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }


    /* HEADER */

    .topbar {
      display: flex;
      justify-content: center;
      align-items: center;

      flex-shrink: 0;
    }

    .brand {
      color: #fff;
      text-decoration: none;

      font-family:
        "Playfair Display",
        serif;

      font-size: clamp(
        46px,
        12vw,
        76px
      );

      font-weight: 800;

      letter-spacing: -3px;

      text-shadow:
        0 5px 35px rgba(0,0,0,.7);
    }


    /* PLAYER AREA */

    .player-section {
      flex: 1;

      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: flex-end;

      flex-direction: column;

      padding-bottom: 22px;
    }


    /* GLASS MUSIC PLAYER */

    .glass-player {

      width: min(
        560px,
        100%
      );

      padding: 13px 15px;

      border-radius: 23px;

      background:
        rgba(20,20,25,.58);

      border:
        1px solid
        rgba(255,255,255,.17);

      backdrop-filter:
        blur(25px);

      -webkit-backdrop-filter:
        blur(25px);

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.55);
    }


    /* TOP PLAYER ROW */

    .player-top {

      display: flex;

      align-items: center;

      gap: 11px;

      width: 100%;
    }


    /* SONG PHOTO */

    .cover {

      width: 55px;
      height: 55px;

      flex-shrink: 0;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.18),
          rgba(255,255,255,.04)
        );

      background-size: cover;
      background-position: center;

      border:
        1px solid
        rgba(255,255,255,.16);

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .cover-note {
      font-size: 22px;
      opacity: .75;
    }


    /* SONG NAME */

    .song-info {

      min-width: 0;

      flex: 1;

      text-align: left;
    }

    .song-info h1 {

      font-size: 14px;

      font-weight: 700;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      line-height: 1.3;
    }

    .song-info p {

      margin-top: 3px;

      font-size: 11px;

      color:
        rgba(255,255,255,.62);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* CONTROLS */

    .controls {

      flex-shrink: 0;

      display: flex;

      align-items: center;

      gap: 8px;
    }

    .controls button {

      width: 34px;
      height: 34px;

      border: 0;

      background: transparent;

      color: #fff;

      font-size: 20px;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    .controls button:active {
      transform: scale(.9);
    }

    .controls .main-play {

      width: 45px;
      height: 45px;

      border-radius: 50%;

      background: #fff;

      color: #111;

      font-size: 16px;

      box-shadow:
        0 7px 22px
        rgba(0,0,0,.4);
    }


    /* PROGRESS */

    .progress-area {

      width: 100%;

      display: grid;

      grid-template-columns:
        32px 1fr 32px;

      align-items: center;

      gap: 7px;

      margin-top: 8px;
    }

    .progress-area span {

      font-size: 10px;

      color:
        rgba(255,255,255,.55);
    }

    #duration {
      text-align: right;
    }

    #progress {

      width: 100%;

      height: 4px;

      accent-color: #fff;

      cursor: pointer;
    }


    /* HIDDEN YOUTUBE */

    #youtubePlayer {

      position: fixed;

      width: 1px;
      height: 1px;

      left: -10000px;
      top: -10000px;

      overflow: hidden;
    }


    /* HIDDEN SEARCH */

    .search-section {
      display: none;
    }


    /* FOOTER */

    footer {

      flex-shrink: 0;

      width: 100%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      font-size: 10px;

      color:
        rgba(255,255,255,.58);
    }

    footer strong {
      color: #fff;
    }

    footer a {

      color: #fff;

      text-decoration: none;
    }


    /* SMALL SCREEN */

    @media (max-height: 650px) {

      .app {
        padding-top: 12px;
        padding-bottom: 10px;
      }

      .brand {
        font-size: 42px;
      }

      .player-section {
        padding-bottom: 12px;
      }

      .glass-player {
        padding: 10px 12px;
      }

      .cover {
        width: 48px;
        height: 48px;
      }

      .controls .main-play {
        width: 40px;
        height: 40px;
      }

      footer {
        display: none;
      }
    }

  </style>

</head>


<body>


  <!-- BACKGROUND -->

  <div class="background"></div>


  <main class="app">


    <!-- LOGO -->

    <header class="topbar">

      <a
        href="#"
        class="brand"
      >
        Relaxify
      </a>

    </header>


    <!-- MUSIC PLAYER -->

    <section class="player-section">


      <div class="glass-player">


        <div class="player-top">


          <!-- SONG PHOTO -->

          <div
            class="cover"
            id="cover"
          >

            <div class="cover-note">
              ♪
            </div>

          </div>


          <!-- SONG NAME -->

          <div class="song-info">

            <h1 id="songTitle">
              Relaxify
            </h1>

            <p id="artistName">
              Indian music
            </p>

          </div>


          <!-- CONTROLS -->

          <div class="controls">

            <button
              id="previousButton"
              type="button"
              aria-label="Previous"
            >
              ⏮
            </button>


            <button
              id="playButton"
              class="main-play"
              type="button"
              aria-label="Play"
            >
              ▶
            </button>


            <button
              id="nextButton"
              type="button"
              aria-label="Next"
            >
              ⏭
            </button>

          </div>


        </div>


        <!-- PROGRESS -->

        <div class="progress-area">

          <span id="currentTime">
            0:00
          </span>

          <input
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
          >

          <span id="duration">
            0:00
          </span>

        </div>


      </div>


    </section>


    <!-- HIDDEN SEARCH -->

    <section
      class="search-section"
    >

      <form id="searchForm">

        <input
          id="searchInput"
          type="search"
        >

        <button type="submit">
          Search
        </button>

      </form>

      <p id="status">
        Ready
      </p>

      <div id="results"></div>

    </section>


    <!-- YOUTUBE PLAYER -->

    <div id="youtubePlayer"></div>


    <!-- FOOTER -->

    <footer>

      <div>
        <strong>Relaxify</strong>
        <span>
          • Made for quieter moments
        </span>
      </div>

      <a
        href="https://instagram.com/sakil_miah_"
        target="_blank"
        rel="noopener noreferrer"
      >
        @sakil_miah_
      </a>

    </footer>


  </main>


  <script>

    /* =========================================
       RELAXIFY MUSIC ENGINE
    ========================================= */

    const API_URL =
      "https://relaxify-api.djboy4696.workers.dev";


    const searchForm =
      document.getElementById(
        "searchForm"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const results =
      document.getElementById(
        "results"
      );

    const status =
      document.getElementById(
        "status"
      );

    const songTitle =
      document.getElementById(
        "songTitle"
      );

    const artistName =
      document.getElementById(
        "artistName"
      );

    const cover =
      document.getElementById(
        "cover"
      );

    const playButton =
      document.getElementById(
        "playButton"
      );

    const previousButton =
      document.getElementById(
        "previousButton"
      );

    const nextButton =
      document.getElementById(
        "nextButton"
      );

    const progress =
      document.getElementById(
        "progress"
      );

    const currentTime =
      document.getElementById(
        "currentTime"
      );

    const duration =
      document.getElementById(
        "duration"
      );

    const youtubePlayer =
      document.getElementById(
        "youtubePlayer"
      );


    let queue = [];

    let currentIndex = -1;

    let player = null;

    let playerReady = false;

    let isPlaying = false;

    let progressTimer = null;


    /* =========================================
       LOAD YOUTUBE IFRAME API
    ========================================= */

    const script =
      document.createElement(
        "script"
      );

    script.src =
      "https://www.youtube.com/iframe_api";

    document.head.appendChild(
      script
    );


    /* =========================================
       YOUTUBE READY
    ========================================= */

    window.onYouTubeIframeAPIReady =
      function () {

        player =
          new YT.Player(
            youtubePlayer,
            {

              height: "1",
              width: "1",

              playerVars: {

                playsinline: 1,

                controls: 0,

                rel: 0,

                modestbranding: 1

              },

              events: {

                onReady:
                  function () {

                    playerReady = true;

                  },


                onStateChange:
                  function (event) {

                    if (
                      event.data ===
                      YT.PlayerState.PLAYING
                    ) {

                      isPlaying = true;

                      playButton.textContent =
                        "❚❚";

                      startProgress();

                    }


                    if (
                      event.data ===
                      YT.PlayerState.PAUSED
                    ) {

                      isPlaying = false;

                      playButton.textContent =
                        "▶";

                      stopProgress();

                    }


                    if (
                      event.data ===
                      YT.PlayerState.ENDED
                    ) {

                      playNext();

                    }

                  }

              }

            }
          );

      };


    /* =========================================
       SEARCH INDIAN MUSIC
    ========================================= */

    async function searchIndianMusic(
      query
    ) {

      try {

        const finalQuery =
          `${query} Hindi Indian song`;


        const url =
          `${API_URL}/search?q=${
            encodeURIComponent(
              finalQuery
            )
          }`;


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "Search failed"
          );

        }


        const data =
          await response.json();


        const items =
          Array.isArray(
            data.items
          )
            ? data.items.filter(
                item =>
                  item &&
                  item.id &&
                  item.id.videoId
              )
            : [];


        if (!items.length) {

          return;

        }


        queue = items;

        playSong(0);

      }

      catch (error) {

        console.error(
          error
        );

      }

    }


    /* =========================================
       PLAY SONG
    ========================================= */

    function playSong(
      index
    ) {

      if (
        !queue.length ||
        index < 0 ||
        index >= queue.length
      ) {

        return;

      }


      const item =
        queue[index];


      const videoId =
        item?.id?.videoId;


      const snippet =
        item?.snippet || {};


      if (!videoId) {

        return;

      }


      currentIndex =
        index;


      songTitle.textContent =
        cleanText(
          snippet.title ||
          "Indian Music"
        );


      artistName.textContent =
        cleanText(
          snippet.channelTitle ||
          "YouTube"
        );


      const thumbnail =
        snippet?.thumbnails?.high?.url ||
        snippet?.thumbnails?.medium?.url ||
        snippet?.thumbnails?.default?.url ||
        "";


      if (thumbnail) {

        cover.style.backgroundImage =
          `url("${thumbnail}")`;

        cover
          .querySelector(
            ".cover-note"
          )
          .style.display =
          "none";

      }


      if (!playerReady) {

        return;

      }


      player.loadVideoById(
        videoId
      );

    }


    /* =========================================
       PLAY / PAUSE
    ========================================= */

    playButton.addEventListener(
      "click",
      function () {

        if (!playerReady) {

          return;

        }


        if (
          currentIndex === -1
        ) {

          searchIndianMusic(
            "latest trending romantic Hindi songs"
          );

          return;

        }


        if (isPlaying) {

          player.pauseVideo();

        }
        else {

          player.playVideo();

        }

      }
    );


    /* =========================================
       NEXT
    ========================================= */

    nextButton.addEventListener(
      "click",
      playNext
    );


    function playNext() {

      if (!queue.length) {

        searchIndianMusic(
          "latest trending romantic Hindi songs"
        );

        return;

      }


      let nextIndex =
        currentIndex + 1;


      if (
        nextIndex >= queue.length
      ) {

        nextIndex = 0;

      }


      playSong(
        nextIndex
      );

    }


    /* =========================================
       PREVIOUS
    ========================================= */

    previousButton.addEventListener(
      "click",
      function () {

        if (!queue.length) {

          return;

        }


        let previousIndex =
          currentIndex - 1;


        if (
          previousIndex < 0
        ) {

          previousIndex =
            queue.length - 1;

        }


        playSong(
          previousIndex
        );

      }
    );


    /* =========================================
       PROGRESS
    ========================================= */

    progress.addEventListener(
      "input",
      function () {

        if (!playerReady) {

          return;

        }


        const total =
          player.getDuration();


        if (!total) {

          return;

        }


        player.seekTo(
          total *
          Number(progress.value) /
          100,
          true
        );

      }
    );


    function startProgress() {

      stopProgress();


      progressTimer =
        setInterval(
          function () {

            if (!playerReady) {

              return;

            }


            const total =
              player.getDuration();


            const current =
              player.getCurrentTime();


            if (!total) {

              return;

            }


            progress.value =
              (
                current /
                total
              ) * 100;


            currentTime.textContent =
              formatTime(
                current
              );


            duration.textContent =
              formatTime(
                total
              );

          },
          500
        );

    }


    function stopProgress() {

      if (progressTimer) {

        clearInterval(
          progressTimer
        );

        progressTimer = null;

      }

    }


    /* =========================================
       HELPERS
    ========================================= */

    function formatTime(
      seconds
    ) {

      if (
        !Number.isFinite(
          seconds
        )
      ) {

        return "0:00";

      }


      const minutes =
        Math.floor(
          seconds / 60
        );


      const secs =
        Math.floor(
          seconds % 60
        );


      return (
        minutes +
        ":" +
        String(
          secs
        ).padStart(
          2,
          "0"
        )
      );

    }


    function cleanText(
      text
    ) {

      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.innerHTML =
        String(text);


      return textarea.value;

    }

  </script>

</body>

</html>
