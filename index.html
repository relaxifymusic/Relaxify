<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#080b12">

  <title>Relaxify — Indian Music</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- BRAND -->
    <header class="topbar">
      <div class="brand">Relaxify</div>

      <button
        id="voiceButton"
        class="voice-top"
        type="button"
        aria-label="Voice control">
        🎙
      </button>
    </header>


    <!-- PLAYER -->
    <section class="player-section">

      <div class="player-card">

        <!-- SONG COVER -->
        <div class="cover" id="cover">
          <div class="cover-note">♪</div>
        </div>


        <!-- SONG INFORMATION -->
        <div class="song-info">

          <h1 id="songTitle">
            Relaxify
          </h1>

          <p id="artistName">
            Indian music for quieter moments
          </p>

        </div>


        <!-- PROGRESS -->
        <div class="progress-area">

          <span id="currentTime">0:00</span>

          <input
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0">

          <span id="duration">0:00</span>

        </div>


        <!-- CONTROLS -->
        <div class="controls">

          <button
            id="previousButton"
            type="button"
            aria-label="Previous">
            ⏮
          </button>

          <button
            id="playButton"
            class="main-play"
            type="button"
            aria-label="Play">
            ▶
          </button>

          <button
            id="nextButton"
            type="button"
            aria-label="Next">
            ⏭
          </button>

        </div>


        <!-- VOLUME -->
        <div class="volume">

          <span>🔊</span>

          <input
            id="volume"
            type="range"
            min="0"
            max="100"
            value="80">

        </div>


        <!-- VOICE -->
        <button
          id="voiceControl"
          class="voice-control"
          type="button">

          🎙
          <span>Voice Control</span>

        </button>

        <p
          id="voiceStatus"
          class="voice-status">
          Say “play”, “pause”, “next” or “previous”
        </p>

      </div>

    </section>


    <!-- SEARCH — hidden from main screen -->
    <section class="search-section">

      <form id="searchForm">

        <input
          id="searchInput"
          type="search"
          placeholder="Search Indian music..."
          autocomplete="off">

        <button type="submit">
          Search
        </button>

      </form>

      <p id="status">Ready</p>

      <div id="results" class="results"></div>

    </section>


    <!-- YOUTUBE PLAYER -->
    <section
      id="hiddenPlayer"
      class="youtube-wrapper"
      aria-hidden="true">

      <div id="youtubePlayer"></div>

    </section>


    <!-- FOOTER -->
    <footer>

      <span>
        Made with ♪ by Sakil
      </span>

      <a
        href="https://instagram.com/sakil_miah_"
        target="_blank"
        rel="noopener noreferrer">

        @sakil_miah_

      </a>

    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
