<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070c">
  <title>Relaxify — Indian Music</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background"></div>

  <main class="app">

    <header class="topbar">

      <div class="brand">
        Relaxify
      </div>

      <button
        id="searchButton"
        class="search-button"
        type="button"
        aria-label="Search"
      >
        🔍
      </button>

    </header>


    <!-- SEARCH -->

    <div
      id="searchPanel"
      class="search-panel"
    >

      <input
        id="searchInput"
        type="search"
        placeholder="Search Hindi song..."
        autocomplete="off"
      >

      <div
        id="searchSuggestions"
        class="search-suggestions"
      ></div>

    </div>


    <!-- PLAYER -->

    <section class="player-section">

      <div class="glass-player">

        <div class="player-top">

          <div
            id="cover"
            class="cover"
          >

            <div class="cover-note">
              ♪
            </div>

          </div>


          <div class="song-info">

            <h1 id="songTitle">
              Relaxify
            </h1>

            <p id="artistName">
              Press play to start Indian music
            </p>

          </div>


          <div class="controls">

            <button
              id="previousButton"
              type="button"
              aria-label="Previous"
            >
              ⏮
            </button>

            <button
              id="playButton"
              class="main-play"
              type="button"
              aria-label="Play"
            >
              ▶
            </button>

            <button
              id="nextButton"
              type="button"
              aria-label="Next"
            >
              ⏭
            </button>

          </div>

        </div>


        <div class="progress-area">

          <span id="currentTime">
            0:00
          </span>

          <input
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
          >

          <span id="duration">
            0:00
          </span>

        </div>


        <div
          id="status"
          class="status"
        >
          Ready
        </div>

      </div>

    </section>


    <!-- YOUTUBE PLAYER -->

    <div
      id="youtubePlayer"
      class="youtube-player"
    ></div>


    <footer>

      <span>
        <strong>Relaxify</strong>
        • Indian Music
      </span>

      <a
        href="https://instagram.com/sakil_miah_"
        target="_blank"
        rel="noopener noreferrer"
      >
        @sakil_miah_
      </a>

    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
