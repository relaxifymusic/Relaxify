<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#05070c">

  <title>Relaxify — Indian Music</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #05070c;
      color: white;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -2;

      background-image:
        linear-gradient(
          rgba(0,0,0,.35),
          rgba(0,0,0,.72)
        ),
        url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1920&q=85");

      background-size: cover;
      background-position: center;
    }

    .app {
      width: 100%;
      height: 100dvh;

      padding: 22px 18px 15px;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand {
      color: white;
      text-decoration: none;

      font-family: "Playfair Display", serif;

      font-size: clamp(45px, 12vw, 76px);

      font-weight: 800;

      letter-spacing: -3px;

      text-shadow:
        0 5px 30px rgba(0,0,0,.7);
    }

    .player-section {
      flex: 1;

      min-height: 0;

      display: flex;
      flex-direction: column;

      justify-content: flex-end;

      padding-bottom: 18px;
    }

    /* SEARCH */

    .search-box {
      width: min(560px, 100%);

      display: flex;

      gap: 7px;

      margin: 0 auto 10px;
    }

    .search-box input {
      flex: 1;

      min-width: 0;

      height: 36px;

      padding: 0 13px;

      border: 1px solid
        rgba(255,255,255,.15);

      border-radius: 12px;

      outline: none;

      color: white;

      background:
        rgba(20,20,25,.52);

      backdrop-filter: blur(20px);

      -webkit-backdrop-filter: blur(20px);
    }

    .search-box input::placeholder {
      color:
        rgba(255,255,255,.55);
    }

    .search-box button {
      height: 36px;

      padding: 0 15px;

      border: 0;

      border-radius: 12px;

      background: white;

      color: #111;

      font-weight: 600;

      cursor: pointer;
    }

    /* PLAYER */

    .glass-player {
      width: min(560px, 100%);

      margin: 0 auto;

      padding: 13px 15px;

      border-radius: 23px;

      background:
        rgba(20,20,25,.58);

      border:
        1px solid
        rgba(255,255,255,.17);

      backdrop-filter: blur(25px);

      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.55);
    }

    .player-top {
      display: flex;

      align-items: center;

      gap: 11px;

      width: 100%;
    }

    .cover {
      width: 55px;
      height: 55px;

      flex-shrink: 0;

      border-radius: 13px;

      background:
        rgba(255,255,255,.08);

      background-size: cover;
      background-position: center;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .cover-note {
      font-size: 22px;
      opacity: .75;
    }

    .song-info {
      min-width: 0;
      flex: 1;
    }

    .song-info h1 {
      font-size: 14px;

      font-weight: 700;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .song-info p {
      margin-top: 3px;

      font-size: 11px;

      color:
        rgba(255,255,255,.62);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .controls {
      flex-shrink: 0;

      display: flex;

      align-items: center;

      gap: 7px;
    }

    .controls button {
      width: 34px;
      height: 34px;

      border: 0;

      background: transparent;

      color: white;

      font-size: 19px;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    .controls button:active {
      transform: scale(.9);
    }

    .controls .main-play {
      width: 44px;
      height: 44px;

      border-radius: 50%;

      background: white;

      color: #111;

      font-size: 16px;
    }

    .progress-area {
      width: 100%;

      display: grid;

      grid-template-columns: 32px 1fr 32px;

      align-items: center;

      gap: 7px;

      margin-top: 8px;
    }

    .progress-area span {
      font-size: 10px;

      color:
        rgba(255,255,255,.55);
    }

    #duration {
      text-align: right;
    }

    #progress {
      width: 100%;
      height: 4px;

      accent-color: white;

      cursor: pointer;
    }

    /* SEARCH RESULTS */

    .results {
      width: min(560px, 100%);

      max-height: 180px;

      overflow-y: auto;

      margin: 0 auto 8px;
    }

    .result-card {
      display: flex;

      align-items: center;

      gap: 9px;

      padding: 7px;

      margin-bottom: 5px;

      border-radius: 12px;

      background:
        rgba(20,20,25,.65);

      border:
        1px solid
        rgba(255,255,255,.1);

      backdrop-filter: blur(15px);
    }

    .result-thumb {
      width: 42px;
      height: 42px;

      object-fit: cover;

      border-radius: 8px;

      flex-shrink: 0;
    }

    .result-info {
      min-width: 0;
      flex: 1;
    }

    .result-title {
      font-size: 12px;

      font-weight: 600;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .result-channel {
      font-size: 10px;

      color:
        rgba(255,255,255,.55);

      margin-top: 2px;
    }

    .result-play {
      width: 32px;
      height: 32px;

      border: 0;

      border-radius: 50%;

      background: white;

      color: #111;

      cursor: pointer;
    }

    #status {
      display: none;
    }

    #youtubePlayer {
      position: fixed;

      width: 1px;
      height: 1px;

      left: -10000px;
      top: -10000px;
    }

    footer {
      flex-shrink: 0;

      width: 100%;

      display: flex;

      justify-content: space-between;

      align-items: center;

      font-size: 10px;

      color:
        rgba(255,255,255,.58);
    }

    footer strong {
      color: white;
    }

    footer a {
      color: white;

      text-decoration: none;
    }

    @media (max-height: 650px) {

      .app {
        padding-top: 10px;
      }

      .brand {
        font-size: 42px;
      }

      .player-section {
        padding-bottom: 10px;
      }

      footer {
        display: none;
      }

    }

  </style>
</head>

<body>

  <div class="background"></div>

  <main class="app">

    <header class="topbar">

      <a
        href="#"
        class="brand"
      >
        Relaxify
      </a>

    </header>


    <section class="player-section">


      <!-- SEARCH -->

      <form
        class="search-box"
        id="searchForm"
      >

        <input
          id="searchInput"
          type="search"
          placeholder="Search Indian songs..."
          autocomplete="off"
        >

        <button type="submit">
          Search
        </button>

      </form>


      <!-- SEARCH RESULTS -->

      <div
        id="results"
        class="results"
      ></div>


      <!-- PLAYER -->

      <div class="glass-player">

        <div class="player-top">


          <div
            class="cover"
            id="cover"
          >

            <div class="cover-note">
              ♪
            </div>

          </div>


          <div class="song-info">

            <h1 id="songTitle">
              Relaxify
            </h1>

            <p id="artistName">
              Indian music
            </p>

          </div>


          <div class="controls">

            <button
              id="previousButton"
              type="button"
            >
              ⏮
            </button>

            <button
              id="playButton"
              class="main-play"
              type="button"
            >
              ▶
            </button>

            <button
              id="nextButton"
              type="button"
            >
              ⏭
            </button>

          </div>

        </div>


        <div class="progress-area">

          <span id="currentTime">
            0:00
          </span>

          <input
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
          >

          <span id="duration">
            0:00
          </span>

        </div>

      </div>

    </section>


    <div id="youtubePlayer"></div>


    <footer>

      <div>
        <strong>Relaxify</strong>
        <span>
          • Made for quieter moments
        </span>
      </div>

      <a
        href="https://instagram.com/sakil_miah_"
        target="_blank"
        rel="noopener noreferrer"
      >
        @sakil_miah_
      </a>

    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
