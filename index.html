<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080b14">

  <title>Relaxify — Indian Music</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="topbar">

      <a href="#" class="brand">
        <span class="brand-icon">♪</span>
        <span>Relaxify</span>
      </a>

      <button
        id="voiceButton"
        class="voice-top"
        type="button"
        title="Voice control"
      >
        🎙️
      </button>

    </header>


    <section class="player-section">

      <div class="cover" id="cover">

        <div class="cover-note">
          ♪
        </div>

      </div>


      <div class="song-info">

        <h1 id="songTitle">
          Relaxify
        </h1>

        <p id="artistName">
          Hindi music for quieter moments
        </p>

      </div>


      <div class="progress-area">

        <span id="currentTime">
          0:00
        </span>

        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
        >

        <span id="duration">
          0:00
        </span>

      </div>


      <div class="controls">

        <button
          id="previousButton"
          type="button"
          aria-label="Previous"
        >
          ⏮
        </button>

        <button
          id="playButton"
          class="main-play"
          type="button"
          aria-label="Play"
        >
          ▶
        </button>

        <button
          id="nextButton"
          type="button"
          aria-label="Next"
        >
          ⏭
        </button>

      </div>


      <div class="volume">

        <span>🔊</span>

        <input
          id="volume"
          type="range"
          min="0"
          max="100"
          value="80"
        >

      </div>


      <button
        id="voiceControl"
        class="voice-control"
        type="button"
      >
        🎙️ <span>Voice Control</span>
      </button>


      <p id="voiceStatus" class="voice-status">
        Tap the microphone and say “next”, “pause”, or “play”
      </p>

    </section>


    <section class="search-section">

      <form id="searchForm">

        <input
          id="searchInput"
          type="search"
          placeholder="Search Hindi music..."
          autocomplete="off"
        >

        <button type="submit">
          Search
        </button>

      </form>

      <p id="status">
        Ready
      </p>

      <div
        id="results"
        class="results"
      ></div>

    </section>


    <section
      id="hiddenPlayer"
      class="youtube-wrapper"
      aria-hidden="true"
    >

      <div id="youtubePlayer"></div>

    </section>


    <footer>

      <div>
        <strong>Relaxify</strong>
        <span>Made for quieter moments.</span>
      </div>

      <a
        href="https://instagram.com/sakil_miah_"
        target="_blank"
        rel="noopener noreferrer"
      >
        @sakil_miah_
      </a>

    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
