<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="RELAXIFY — a cinematic music experience."
  />

  <meta name="theme-color" content="#0b0d12" />

  <title>RELAXIFY</title>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main id="app">

    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div
      id="background"
      class="background"
      aria-hidden="true"
    ></div>

    <div
      id="backgroundOverlay"
      class="background-overlay"
      aria-hidden="true"
    ></div>


    <!-- =========================================
         RELAXIFY LOGO / TITLE
    ========================================== -->

    <header class="brand-container">
      <h1 id="brand" class="brand">
        RELAXIFY
      </h1>
    </header>


    <!-- =========================================
         LYRICS AREA
    ========================================== -->

    <section
      id="lyricsArea"
      class="lyrics-area"
      aria-live="polite"
      aria-label="Song lyrics"
    >

      <!-- JavaScript will insert lyrics here -->

    </section>


    <!-- =========================================
         BOTTOM CONTROLS
    ========================================== -->

    <section class="controls-area">


      <!-- =======================================
           SEARCH
      ======================================== -->

      <div id="searchContainer" class="search-container">

        <!-- Normally only this button is visible -->
        <button
          id="searchButton"
          class="search-button glass-button"
          type="button"
          aria-label="Open search"
          aria-expanded="false"
        >
          🔍
        </button>


        <!-- Expanded search panel -->

        <div
          id="searchPanel"
          class="search-panel glass"
          hidden
        >

          <div class="search-input-container">

            <span
              class="search-icon"
              aria-hidden="true"
            >
              🔍
            </span>

            <input
              id="searchInput"
              type="search"
              placeholder="Search songs..."
              autocomplete="off"
              spellcheck="false"
              aria-label="Search songs"
            />

            <button
              id="clearSearchButton"
              class="clear-search"
              type="button"
              aria-label="Clear search"
            >
              ✕
            </button>

          </div>


          <!-- Search results / recent searches -->

          <div
            id="searchResults"
            class="search-results"
          >

            <!--
              JavaScript will insert:

              Recent searches
              Search suggestions
              Album artwork
              Song name
              Artist name
            -->

          </div>

        </div>

      </div>


      <!-- =======================================
           MUSIC PLAYER
      ======================================== -->

      <div
        id="musicPlayer"
        class="music-player glass"
      >


        <!-- Album artwork -->

        <div class="album-art-container">

          <img
            id="albumArt"
            class="album-art"
            src="assets/default-art.jpg"
            alt="Album artwork"
          />

        </div>


        <!-- Song information -->

        <div class="song-information">

          <div
            id="songTitle"
            class="song-title"
          >
            Loading...
          </div>

          <div
            id="artistName"
            class="artist-name"
          >
            —
          </div>


          <!-- Progress -->

          <div class="progress-container">

            <input
              id="progressBar"
              class="progress-bar"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              aria-label="Song progress"
            />

          </div>

        </div>


        <!-- =====================================
             PLAYER BUTTONS
        ====================================== -->

        <div class="player-buttons">

          <button
            id="previousButton"
            class="player-button small-button glass-button"
            type="button"
            aria-label="Previous song"
          >
            ⏮
          </button>


          <button
            id="playButton"
            class="player-button play-button glass-button"
            type="button"
            aria-label="Play"
          >
            ▶
          </button>


          <button
            id="nextButton"
            class="player-button small-button glass-button"
            type="button"
            aria-label="Next song"
          >
            ⏭
          </button>

        </div>


        <!-- Lyrics button -->

        <button
          id="lyricsButton"
          class="lyrics-button glass-button"
          type="button"
          aria-label="Show lyrics"
        >
          ♪ Lyrics
        </button>

      </div>

    </section>


    <!-- =========================================
         HIDDEN AUDIO / PLAYER HOST
    ========================================== -->

    <div
      id="audioPlayer"
      class="audio-player"
      aria-hidden="true"
    ></div>


    <!-- =========================================
         NOTIFICATION / TOAST
    ========================================== -->

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
    ></div>

  </main>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
